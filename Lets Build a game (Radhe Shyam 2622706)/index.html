<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlight Collector</title>
    <style>
        body {
            background-color: #0b0b1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        canvas {
            background-color: #12122b;
            border: 2px solid #4a4ae2;
            box-shadow: 0 0 15px rgba(74, 74, 226, 0.5);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        
        let score = 0;
        let lives = 3;
        let gameState = "playing"; 

        const basket = {
            x: 250,
            y: 350,
            width: 100,
            height: 15,
            speed: 7
        };

        let items = [];

        
        const keys = {};
        window.addEventListener("keydown", (e) => { keys[e.key] = true; });
        window.addEventListener("keyup", (e) => { keys[e.key] = false; });

        function spawnItem() {
            const isDebris = Math.random() < 0.3; 
            items.push({
                x: Math.random() * (canvas.width - 20) + 10,
                y: -20,
                radius: 10,
                speed: 2 + Math.random() * 2.5,
                type: isDebris ? "debris" : "star"
            });
        }

        
        setInterval(() => {
            if (gameState === "playing") {
                spawnItem();
            }
        }, 1000);

        function update() {
            if (gameState !== "playing") return;

            
            if (keys["ArrowLeft"] && basket.x > 0) {
                basket.x -= basket.speed;
            }
            if (keys["ArrowRight"] && basket.x + basket.width < canvas.width) {
                basket.x += basket.speed;
            }

            
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;

                
                if (
                    item.y + item.radius >= basket.y &&
                    item.y - item.radius <= basket.y + basket.height &&
                    item.x >= basket.x &&
                    item.x <= basket.x + basket.width
                ) {
                    if (item.type === "star") {
                        score += 1;
                        if (score >= 30) {
                            gameState = "win";
                        }
                    } else {
                        lives -= 1;
                        if (lives <= 0) {
                            gameState = "gameover";
                        }
                    }
                    items.splice(i, 1);
                    continue;
                }

                
                if (item.y > canvas.height + 20) {
                    items.splice(i, 1);
                }
            }
        }

        function draw() {
            
            ctx.fillStyle = "#12122b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState === "playing") {
                // Draw Basket
                ctx.fillStyle = "#4a4ae2";
                ctx.fillRect(basket.x, basket.y, basket.width, basket.height);

                
                items.forEach(item => {
                    ctx.beginPath();
                    ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
                    ctx.fillStyle = item.type === "star" ? "#00ffff" : "#ff4d4d";
                    ctx.fill();
                    ctx.closePath();
                });

                
                ctx.fillStyle = "#ffffff";
                ctx.font = "18px Arial";
                ctx.fillText(`Score: ${score} / 30`, 20, 30);
                ctx.fillText(`Lives: ${lives}`, canvas.width - 90, 30);
            } else {
                
                ctx.fillStyle = "#ffffff";
                ctx.font = "28px Arial";
                ctx.textAlign = "center";
                if (gameState === "win") {
                    ctx.fillText("You Win! Stardust Collected!", canvas.width / 2, canvas.height / 2 - 20);
                } else {
                    ctx.fillText("Game Over! Out of Lives.", canvas.width / 2, canvas.height / 2 - 20);
                }
                ctx.font = "15px Arial";
                ctx.fillText("Refresh the page to play again", canvas.width / 2, canvas.height / 2 + 25);
                ctx.textAlign = "left";
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
