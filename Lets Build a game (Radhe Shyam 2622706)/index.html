<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Catcher</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        canvas {
            background-color: #16213e;
            border: 2px solid #0f3460;
            box-shadow: 0 0 15px rgba(15, 52, 96, 0.8);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Game State Variables
        let score = 0;
        let lives = 3;
        let gameState = "playing"; // "playing", "win", "gameover"

        const basket = {
            x: 250,
            y: 350,
            width: 100,
            height: 15,
            speed: 7
        };

        let items = [];

        // Track Keyboard Input
        const keys = {};
        window.addEventListener("keydown", (e) => { keys[e.key] = true; });
        window.addEventListener("keyup", (e) => { keys[e.key] = false; });

        function spawnItem() {
            const isBomb = Math.random() < 0.3; // 30% chance for a bomb
            items.push({
                x: Math.random() * (canvas.width - 30) + 15,
                y: -30,
                radius: 12,
                speed: 2 + Math.random() * 2.5,
                type: isBomb ? "bomb" : "fruit"
            });
        }

        // Spawn items every second
        setInterval(() => {
            if (gameState === "playing") {
                spawnItem();
            }
        }, 1000);

        function update() {
            if (gameState !== "playing") return;

            // Basket Movement Control
            if (keys["ArrowLeft"] && basket.x > 0) {
                basket.x -= basket.speed;
            }
            if (keys["ArrowRight"] && basket.x + basket.width < canvas.width) {
                basket.x += basket.speed;
            }

            // Update Falling Items
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;

                // Check collision with basket
                if (
                    item.y + item.radius >= basket.y &&
                    item.y - item.radius <= basket.y + basket.height &&
                    item.x >= basket.x &&
                    item.x <= basket.x + basket.width
                ) {
                    if (item.type === "fruit") {
                        score += 1;
                        if (score >= 30) {
                            gameState = "win";
                        }
                    } else {
                        lives -= 1;
                        if (lives <= 0) {
                            gameState = "gameover";
                        }
                    }
                    items.splice(i, 1);
                    continue;
                }

                // Remove items that fall past the bottom
                if (item.y > canvas.height + 30) {
                    items.splice(i, 1);
                }
            }
        }

        function draw() {
            // Clear Canvas Background
            ctx.fillStyle = "#16213e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState === "playing") {
                // Draw Basket (Cart/Catcher)
                ctx.fillStyle = "#e94560";
                ctx.fillRect(basket.x, basket.y, basket.width, basket.height);

                // Draw Falling Items (Fruits & Bombs)
                items.forEach(item => {
                    ctx.save();
                    ctx.translate(item.x, item.y);

                    if (item.type === "fruit") {
                        // Draw Apple/Fruit Shape (Red circle with a green leaf)
                        ctx.beginPath();
                        ctx.arc(0, 0, item.radius, 0, Math.PI * 2);
                        ctx.fillStyle = "#ff3333";
                        ctx.fill();
                        ctx.closePath();

                        // Stem & Leaf
                        ctx.beginPath();
                        ctx.moveTo(0, -item.radius);
                        ctx.lineTo(0, -item.radius - 5);
                        ctx.strokeStyle = "#8B4513";
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.ellipse(4, -item.radius - 4, 4, 2, Math.PI / 4, 0, Math.PI * 2);
                        ctx.fillStyle = "#4BB543";
                        ctx.fill();
                        ctx.closePath();
                    } else {
                        // Draw Bomb Shape (Black circle, cap, and lit fuse)
                        ctx.beginPath();
                        ctx.arc(0, 2, item.radius - 2, 0, Math.PI * 2);
                        ctx.fillStyle = "#222222";
                        ctx.fill();
                        ctx.closePath();

                        // Bomb top cap
                        ctx.fillStyle = "#555555";
                        ctx.fillRect(-3, -item.radius + 1, 6, 4);

                        // Lit Fuse & Spark
                        ctx.beginPath();
                        ctx.moveTo(0, -item.radius + 1);
                        ctx.quadraticCurveTo(6, -item.radius - 6, 10, -item.radius - 10);
                        ctx.strokeStyle = "#d4a373";
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        // Spark flame
                        ctx.beginPath();
                        ctx.arc(10, -item.radius - 10, 3, 0, Math.PI * 2);
                        ctx.fillStyle = "#ffcc00";
                        ctx.fill();
                        ctx.closePath();
                    }

                    ctx.restore();
                });

                // Draw Score and Lives HUD
                ctx.fillStyle = "#ffffff";
                ctx.font = "18px Arial";
                ctx.fillText(`Score: ${score} / 30`, 20, 30);
                ctx.fillText(`Lives: ${lives}`, canvas.width - 90, 30);
            } else {
                // Draw Win / Game Over Screen
                ctx.fillStyle = "#ffffff";
                ctx.font = "28px Arial";
                ctx.textAlign = "center";
                if (gameState === "win") {
                    ctx.fillText("You Win! All Fruits Collected!", canvas.width / 2, canvas.height / 2 - 20);
                } else {
                    ctx.fillText("Game Over! Exploded by a Bomb.", canvas.width / 2, canvas.height / 2 - 20);
                }
                ctx.font = "15px Arial";
                ctx.fillText("Refresh the page to play again", canvas.width / 2, canvas.height / 2 + 25);
                ctx.textAlign = "left";
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
