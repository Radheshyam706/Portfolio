<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        canvas {
            background-color: #000000;
            border: 2px solid #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="700" height="500"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Game Constants matching Pygame code
        const WIDTH = 700;
        const HEIGHT = 500;
        const FPS = 60;
        const PADDLE_WIDTH = 20;
        const PADDLE_HEIGHT = 100;
        const BALL_RADIUS = 7;
        const WINNING_SCORE = 10;

        // Key State Tracking
        const keys = {};
        window.addEventListener("keydown", (e) => { keys[e.key] = true; });
        window.addEventListener("keyup", (e) => { keys[e.key] = false; });

        class Paddle {
            constructor(x, y, width, height) {
                this.originalX = x;
                this.originalY = y;
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.vel = 4;
            }

            draw() {
                ctx.fillStyle = "#FFFFFF";
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }

            move(up = true) {
                if (up) {
                    this.y -= this.vel;
                } else {
                    this.y += this.vel;
                }
            }

            reset() {
                this.x = this.originalX;
                this.y = this.originalY;
            }
        }

        class Ball {
            constructor(x, y, radius) {
                this.originalX = x;
                this.originalY = y;
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.maxVel = 5;
                this.xVel = this.maxVel;
                this.yVel = 0;
            }

            draw() {
                ctx.fillStyle = "#FFFFFF";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            move() {
                this.x += this.xVel;
                this.y += this.yVel;
            }

            reset() {
                this.x = this.originalX;
                this.y = this.originalY;
                this.yVel = 0;
                this.xVel *= -1;
            }
        }

        // Initialize Game Objects
        const leftPaddle = new Paddle(10, HEIGHT / 2 - PADDLE_HEIGHT / 2, PADDLE_WIDTH, PADDLE_HEIGHT);
        const rightPaddle = new Paddle(WIDTH - 10 - PADDLE_WIDTH, HEIGHT / 2 - PADDLE_HEIGHT / 2, PADDLE_WIDTH, PADDLE_HEIGHT);
        const ball = new Ball(WIDTH / 2, HEIGHT / 2, BALL_RADIUS);

        let leftScore = 0;
        let rightScore = 0;
        let isWaitingForReset = false;

        function draw() {
            // Fill Background
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            // Draw Scores
            ctx.fillStyle = "#FFFFFF";
            ctx.font = "50px 'Comic Sans MS', sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(leftScore, WIDTH / 4, 50);
            ctx.fillText(rightScore, (WIDTH * 3) / 4, 50);

            // Draw Paddles & Ball
            leftPaddle.draw();
            rightPaddle.draw();
            ball.draw();

            // Draw Center Dashed Line
            const segmentHeight = HEIGHT / 20;
            for (let i = 10; i < HEIGHT; i += segmentHeight) {
                const index = Math.floor(i / segmentHeight);
                if (index % 2 === 1) continue;
                ctx.fillRect(WIDTH / 2 - 5, i, 10, segmentHeight);
            }
        }

        function handlePaddleMovement() {
            // Left Paddle Controls (W / S)
            if ((keys["w"] || keys["W"]) && leftPaddle.y - leftPaddle.vel >= 0) {
                leftPaddle.move(true);
            }
            if ((keys["s"] || keys["S"]) && leftPaddle.y + leftPaddle.vel + leftPaddle.height <= HEIGHT) {
                leftPaddle.move(false);
            }

            // Right Paddle Controls (ArrowUp / ArrowDown)
            if (keys["ArrowUp"] && rightPaddle.y - rightPaddle.vel >= 0) {
                rightPaddle.move(true);
            }
            if (keys["ArrowDown"] && rightPaddle.y + rightPaddle.vel + rightPaddle.height <= HEIGHT) {
                rightPaddle.move(false);
            }
        }

        function handleCollision() {
            // Top and Bottom Wall Collisions
            if (ball.y + ball.radius >= HEIGHT || ball.y - ball.radius <= 0) {
                ball.yVel *= -1;
            }

            // Left Paddle Collision
            if (ball.xVel < 0) {
                if (ball.y >= leftPaddle.y && ball.y <= leftPaddle.y + leftPaddle.height) {
                    if (ball.x - ball.radius <= leftPaddle.x + leftPaddle.width) {
                        ball.xVel *= -1;

                        const middleY = leftPaddle.y + leftPaddle.height / 2;
                        const differenceInY = middleY - ball.y;
                        const reductionFactor = (leftPaddle.height / 2) / ball.maxVel;
                        const yVel = differenceInY / reductionFactor;
                        ball.yVel = -1 * yVel;
                    }
                }
            } 
            // Right Paddle Collision
            else {
                if (ball.y >= rightPaddle.y && ball.y <= rightPaddle.y + rightPaddle.height) {
                    if (ball.x + ball.radius >= rightPaddle.x) {
                        ball.xVel *= -1;

                        const middleY = rightPaddle.y + rightPaddle.height / 2;
                        const differenceInY = middleY - ball.y;
                        const reductionFactor = (rightPaddle.height / 2) / ball.maxVel;
                        const yVel = differenceInY / reductionFactor;
                        ball.yVel = -1 * yVel;
                    }
                }
            }
        }

        function resetGame() {
            ball.reset();
            leftPaddle.reset();
            rightPaddle.reset();
            leftScore = 0;
            rightScore = 0;
            isWaitingForReset = false;
        }

        function gameLoop() {
            if (!isWaitingForReset) {
                handlePaddleMovement();
                ball.move();
                handleCollision();

                // Point Scoring
                if (ball.x < 0) {
                    rightScore += 1;
                    ball.reset();
                } else if (ball.x > WIDTH) {
                    leftScore += 1;
                    ball.reset();
                }

                draw();

                // Check Win Condition
                let won = false;
                let winText = "";

                if (leftScore >= WINNING_SCORE) {
                    won = true;
                    winText = "Left Player Won!";
                } else if (rightScore >= WINNING_SCORE) {
                    won = true;
                    winText = "Right Player Won!";
                }

                if (won) {
                    isWaitingForReset = true;
                    ctx.fillStyle = "#FFFFFF";
                    ctx.font = "50px 'Comic Sans MS', sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(winText, WIDTH / 2, HEIGHT / 2);

                    setTimeout(() => {
                        resetGame();
                        requestAnimationFrame(gameLoop);
                    }, 5000);
                    return;
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // Start Game Loop
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
