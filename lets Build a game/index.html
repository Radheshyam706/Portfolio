<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Catcher</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; color: #f5f7ff;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: radial-gradient(ellipse at top, #20284b 0%, #0d1020 55%, #070911 100%);
  }
  .game-shell { width: min(100%, 660px); text-align: center; }
  h1 { margin: 0 0 6px; font-size: clamp(1.8rem, 5vw, 2.7rem); letter-spacing: .08em; }
  h1 span { color: #ff5b68; }
  .subtitle { margin: 0 0 18px; color: #aeb8d9; font-size: .95rem; }
  .cabinet {
    padding: 12px; border: 1px solid #46517e; border-radius: 18px;
    background: linear-gradient(145deg, #171c35, #0c1021);
    box-shadow: 0 18px 55px #0008, inset 0 1px #ffffff12;
  }
  canvas {
    display: block; width: 100%; height: auto; aspect-ratio: 3 / 2;
    border-radius: 9px; background: #10162b; image-rendering: auto;
    outline: 1px solid #323d66;
  }
  .help { margin: 14px 0 0; color: #b7c0df; font-size: .9rem; line-height: 1.6; }
  .key {
    display: inline-block; min-width: 28px; padding: 2px 8px; margin: 0 2px;
    border: 1px solid #59658f; border-bottom-width: 3px; border-radius: 6px;
    background: #222a49; color: white; font-weight: 700;
  }
  .note { margin-top: 8px; color: #7884aa; font-size: .78rem; }
</style>
</head>
<body>
<main class="game-shell">
  <h1>FRUIT <span>CATCHER</span></h1>
  <p class="subtitle">Catch the fruit. Dodge the bombs. Chase the high score!</p>
  <div class="cabinet">
    <canvas id="game" width="600" height="400" aria-label="Fruit Catcher arcade game"></canvas>
  </div>
  <p class="help"><span class="key">←</span> <span class="key">→</span> Move your basket &nbsp; • &nbsp; Catch fruit for <strong>+1</strong> point &nbsp; • &nbsp; Avoid bombs!</p>
  <p class="note">Reach 30 points to win. You have 3 lives. Refresh the page to play again.</p>
</main>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  const basket = { x: W / 2 - 50, y: 350, w: 100, h: 15, speed: 360 };
  const keys = { left: false, right: false };
  let items = [], score = 0, lives = 3, state = "playing";
  let lastTime = 0, spawnTimer = 0, animationId;
  let particles = [];
  const WIN_SCORE = 30;

  function setKey(event, down) {
    if (["ArrowLeft", "ArrowRight", " "].includes(event.key)) event.preventDefault();
    if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") keys.left = down;
    if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") keys.right = down;
  }
  window.addEventListener("keydown", e => setKey(e, true));
  window.addEventListener("keyup", e => setKey(e, false));
  window.addEventListener("blur", () => { keys.left = false; keys.right = false; });

  function spawnItem() {
    const hazard = Math.random() < 0.30;
    const r = hazard ? 14 : 13;
    items.push({
      x: r + Math.random() * (W - r * 2), y: -22,
      r, type: hazard ? "bomb" : "fruit",
      speed: 115 + Math.random() * 65,
      phase: Math.random() * Math.PI * 2
    });
  }

  function burst(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, s = 35 + Math.random() * 125;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: .35 + Math.random() * .35, maxLife: .7, color, size: 2 + Math.random() * 3 });
    }
  }

  function update(dt) {
    if (state !== "playing") return;
    if (keys.left) basket.x -= basket.speed * dt;
    if (keys.right) basket.x += basket.speed * dt;
    basket.x = Math.max(0, Math.min(W - basket.w, basket.x));

    spawnTimer += dt;
    while (spawnTimer >= 1) { spawnTimer -= 1; spawnItem(); }

    for (let i = items.length - 1; i >= 0; i--) {
      const item = items[i];
      item.y += item.speed * dt;
      item.phase += dt * 5;
      const caught = item.y + item.r >= basket.y &&
        item.y - item.r <= basket.y + basket.h &&
        item.x + item.r >= basket.x && item.x - item.r <= basket.x + basket.w;
      if (caught) {
        if (item.type === "fruit") {
          score++;
          burst(item.x, item.y, "#ff6675", 8);
          if (score >= WIN_SCORE) state = "won";
        } else {
          lives--;
          burst(item.x, item.y, "#ffb14a", 14);
          if (lives <= 0) state = "lost";
        }
        items.splice(i, 1);
      } else if (item.y - item.r > H) {
        items.splice(i, 1);
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 180 * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawBackground(time) {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#111a35"); grad.addColorStop(1, "#080d1e");
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

    // Subtle arcade grid
    ctx.strokeStyle = "rgba(100,130,205,.09)"; ctx.lineWidth = 1;
    for (let x = 20; x < W; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 20; y < H; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    // Small glowing stars
    for (let i = 0; i < 28; i++) {
      const x = (i * 97 + 31) % W, y = (i * 53 + 17) % 325;
      const alpha = .22 + .18 * Math.sin(time / 600 + i);
      ctx.fillStyle = `rgba(180,205,255,${alpha})`;
      ctx.fillRect(x, y, 2, 2);
    }
    ctx.fillStyle = "#ff5268"; ctx.fillRect(0, H - 3, W, 3);
    ctx.fillStyle = "rgba(255,82,104,.15)"; ctx.fillRect(0, H - 8, W, 5);
  }

  function drawApple(item) {
    const x = item.x, y = item.y, r = item.r;
    ctx.save(); ctx.translate(x, y);
    // Soft glow
    ctx.shadowColor = "#ff3d58"; ctx.shadowBlur = 13;
    const g = ctx.createRadialGradient(-5, -6, 2, 0, 0, r + 2);
    g.addColorStop(0, "#ff9b9e"); g.addColorStop(.5, "#f53b50"); g.addColorStop(1, "#a90f32");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 1, r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // Apple top indent and highlight
    ctx.fillStyle = "#b91531";
    ctx.beginPath(); ctx.ellipse(0, -r + 3, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#79502f"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, -r + 2); ctx.quadraticCurveTo(1, -r - 5, 4, -r - 7); ctx.stroke();
    ctx.fillStyle = "#70e36e";
    ctx.beginPath(); ctx.ellipse(7, -r - 4, 5, 2.7, -.45, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.65)";
    ctx.beginPath(); ctx.ellipse(-5, -3, 2.4, 4.5, -.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawBomb(item, time) {
    const x = item.x, y = item.y, r = item.r;
    ctx.save(); ctx.translate(x, y);
    ctx.shadowColor = "#ff9f43"; ctx.shadowBlur = 9;
    const g = ctx.createRadialGradient(-5, -6, 1, 0, 0, r + 3);
    g.addColorStop(0, "#687080"); g.addColorStop(.55, "#303746"); g.addColorStop(1, "#11141d");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 2, r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // Metal cap
    ctx.fillStyle = "#aeb8c8"; ctx.fillRect(-5, -r - 3, 10, 5);
    ctx.fillStyle = "#596273"; ctx.fillRect(-3, -r - 5, 6, 3);
    // Fuse and animated spark
    ctx.strokeStyle = "#d4b18a"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, -r - 4); ctx.quadraticCurveTo(7, -r - 10, 9, -r - 12); ctx.stroke();
    const flicker = .7 + .3 * Math.sin(time / 45 + item.phase);
    ctx.globalAlpha = flicker;
    ctx.fillStyle = "#ffb12e"; ctx.beginPath(); ctx.arc(10, -r - 13, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff3a1"; ctx.beginPath(); ctx.arc(10, -r - 13, 2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ff7043"; ctx.lineWidth = 1.5;
    for (let i = 0; i < 4; i++) {
      const a = time / 80 + i * Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(10 + Math.cos(a) * 5, -r - 13 + Math.sin(a) * 5);
      ctx.lineTo(10 + Math.cos(a) * (8 + Math.random() * 2), -r - 13 + Math.sin(a) * (8 + Math.random() * 2)); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#9da7b7"; ctx.beginPath(); ctx.arc(-5, -2, 2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawBasket() {
    const x = basket.x, y = basket.y, w = basket.w, h = basket.h;
    ctx.save();
    ctx.shadowColor = "#36e7ff"; ctx.shadowBlur = 12;
    const g = ctx.createLinearGradient(0, y, 0, y + h + 13);
    g.addColorStop(0, "#70f4ff"); g.addColorStop(.35, "#22b8e8"); g.addColorStop(1, "#1765a6");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y);
    ctx.lineTo(x + w - 10, y + h + 10); ctx.quadraticCurveTo(x + w / 2, y + h + 17, x + 10, y + h + 10);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#b9fbff"; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = "rgba(7,51,98,.7)"; ctx.lineWidth = 2;
    for (let i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo(x + i * w / 6, y + 3); ctx.lineTo(x + i * w / 6, y + h + 9); ctx.stroke();
    }
    ctx.restore();
  }

  function drawHUD() {
    ctx.fillStyle = "rgba(5,9,23,.72)";
    roundedRect(14, 13, 142, 39, 9); roundedRect(W - 144, 13, 130, 39, 9);
    ctx.font = "bold 15px system-ui, sans-serif"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#9aa8d4"; ctx.textAlign = "left"; ctx.fillText("SCORE", 26, 26);
    ctx.font = "bold 19px system-ui, sans-serif"; ctx.fillStyle = "#ffffff"; ctx.fillText(String(score).padStart(2, "0"), 26, 42);
    ctx.font = "bold 15px system-ui, sans-serif"; ctx.fillStyle = "#9aa8d4"; ctx.textAlign = "left"; ctx.fillText("LIVES", W - 132, 26);
    ctx.font = "bold 18px system-ui, sans-serif";
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < lives ? "#ff5b68" : "#454b61";
      ctx.fillText("♥", W - 132 + i * 25, 42);
    }
  }

  function roundedRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
  }

  function drawEndScreen() {
    ctx.fillStyle = "rgba(4,7,18,.78)"; ctx.fillRect(0, 0, W, H);
    const won = state === "won";
    ctx.save();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.shadowColor = won ? "#4cffb0" : "#ff5268"; ctx.shadowBlur = 24;
    ctx.fillStyle = won ? "#66ffc1" : "#ff697b";
    ctx.font = "900 42px system-ui, sans-serif";
    ctx.fillText(won ? "YOU WIN!" : "GAME OVER", W / 2, 151);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ffffff"; ctx.font = "bold 22px system-ui, sans-serif";
    ctx.fillText(`Final Score: ${score}`, W / 2, 205);
    ctx.fillStyle = "#b9c4e5"; ctx.font = "16px system-ui, sans-serif";
    ctx.fillText(won ? "Amazing catching!" : "The bombs got you this time.", W / 2, 241);
    ctx.fillStyle = "#dce4ff"; ctx.font = "15px system-ui, sans-serif";
    ctx.fillText("Refresh the page to play again", W / 2, 282);
    ctx.restore();
  }

  function render(time) {
    drawBackground(time);
    items.forEach(item => item.type === "fruit" ? drawApple(item) : drawBomb(item, time));
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    drawBasket(); drawHUD();
    if (state !== "playing") drawEndScreen();
  }

  function loop(time) {
    const dt = Math.min((time - (lastTime || time)) / 1000, .033);
    lastTime = time;
    update(dt); render(time);
    if (state === "playing") animationId = requestAnimationFrame(loop);
  }
  render(0);
  animationId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
